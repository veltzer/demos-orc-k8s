# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["exercises"]
src_files = ["README.md"]

[processor.zspell]
src_dirs = ["exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "config", "exercises"]

[processor.pylint]
src_dirs = ["scripts", "config", "exercises"]
batch = false

[processor.mypy]
src_dirs = ["scripts", "config", "exercises"]
batch = false
# mypy 2.3 crashes with an INTERNAL ERROR on the shared incremental cache
# under concurrent per-file runs; --no-incremental sidesteps it (every file
# is still fully checked).
args = ["--no-incremental", "--cache-dir=/dev/null"]

[processor.shellcheck]
src_dirs = ["scripts", "exercises", "config", "examples"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── yaml ────────────────────────────────────────────────────────────────────

# the helm chart's templates/ hold Go templating ({{- if ... }}), not YAML
# documents, so yamllint cannot parse them; the chart's own values.yaml and
# Chart.yaml are still checked.
[processor.yamllint]
src_dirs = ["examples", "exercises"]
src_exclude_dirs = ["exercises/21_create_helm_chart/mychart/templates"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.hadolint]
src_dirs = ["examples", "exercises"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.cppcheck]
src_dirs = ["exercises/30_mucho_virtual_ram"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]
