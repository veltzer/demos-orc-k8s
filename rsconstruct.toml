# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["exercises"]

[processor.zspell]
src_dirs = ["exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "config", "exercises"]

[processor.pylint]
src_dirs = ["scripts", "config", "exercises"]
batch = false

[processor.mypy]
src_dirs = ["scripts", "config", "exercises"]
batch = false
# mypy 2.3 crashes with an INTERNAL ERROR on the shared incremental cache
# under concurrent per-file runs; --no-incremental sidesteps it (every file
# is still fully checked).
args = ["--no-incremental", "--cache-dir=/dev/null"]

[processor.shellcheck]
src_dirs = ["scripts", "exercises", "config"]
args = ["--severity=error", "--shell=bash"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
